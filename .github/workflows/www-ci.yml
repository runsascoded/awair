name: WWW CI & Deploy
on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/www-ci.yml']
  pull_request:
    branches: [main]
    paths: ['www/**', '.github/workflows/www-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "www-deploy"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'www/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./www
        run: pnpm install

      - name: Lint
        working-directory: ./www
        run: pnpm run lint

      - name: Build
        working-directory: ./www
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: ./www
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./www
        run: pnpm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: www/playwright-report/
          retention-days: 7

      - name: Upload dist
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: www-dist
          path: www/dist
          retention-days: 7

  # Cloudflare Pages is the only deploy target: `air.rbw.sh` resolves to
  # the `awair-www` CF Pages project. Requires the `CLOUDFLARE_API_TOKEN`
  # secret (Account · Cloudflare Pages · Edit) and the
  # `CLOUDFLARE_ACCOUNT_ID` variable — an account ID isn't a credential
  # (it's in every dashboard URL, and useless without a token), so it's a
  # var, which also means it's readable in logs when debugging. The job
  # fails loudly if either is missing, rather than passing while shipping
  # nothing.
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      # Via `env:` rather than inline `${{ }}`, so neither value is
      # interpolated into the script body.
      - name: Require CF credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CF_API_TOKEN" ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ -n "$CF_ACCOUNT_ID" ] || missing+=("variable CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing ${missing[*]}; cannot deploy to CF Pages."
            exit 1
          fi
      # Reuse `build-and-test`'s `dist` rather than reinstalling +
      # rebuilding: guarantees we ship exactly what the E2E suite ran
      # against, and halves the workflow's wall-clock.
      - uses: actions/download-artifact@v4
        with:
          name: www-dist
          path: www/dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: www
          command: pages deploy dist --project-name=awair-www --branch=main --commit-hash=${{ github.sha }}
